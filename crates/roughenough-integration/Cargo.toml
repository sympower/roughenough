[package]
name = "roughenough-integration-test"
description = "End-to-end integration tests for Roughenough server and client"
license = "Apache-2.0 OR MIT"
edition.workspace = true
version.workspace = true
repository = "https://github.com/sympower/roughenough"
homepage = "https://github.com/sympower/roughenough"
readme = "../../README.md"
keywords = ["roughtime", "integration", "testing", "e2e"]
categories = ["development-tools"]

[dependencies]
roughenough-client = { workspace = true }
roughenough-common = { workspace = true }
roughenough-merkle = { workspace = true }
roughenough-protocol = { workspace = true }
roughenough-server = { workspace = true, features = ["test-utils"] }
aws-lc-rs = { workspace = true }
data-encoding = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
portable-atomic = { workspace = true }

[[bin]]
name = "roughenough_integration_test"
path = "src/main.rs"

[[bin]]
name = "roughenough_load_test"
path = "src/load_gen.rs"

